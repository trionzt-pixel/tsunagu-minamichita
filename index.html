<style>
/* Layout: 海図のような地図を主役に、右に現在地の行動パネル、画面下にRPGの会話窓を固定 */
:root {
  --bg: #e6eeeb;
  --sea: #cfe2de;
  --sea-line: #b3cfc9;
  --land: #f2e9d3;
  --land-edge: #c9b88f;
  --ink: #1e3640;
  --ink-soft: #546d74;
  --card: #fffcf5;
  --paper: #fbf7ec;
  --line: #d6ccb4;
  --tai: #c0472f;
  --tai-soft: #f6dcd3;
  --nori: #2c5b4c;
  --nori-soft: #d9e9e1;
  --mikan: #c98414;
  --mikan-soft: #f7e6c4;
  --shadow: 0 1px 0 rgba(30,54,64,.08), 0 6px 18px rgba(30,54,64,.08);
  --f-pixel: "DotGothic16", "Hiragino Kaku Gothic ProN", "Yu Gothic", monospace;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1a20; --sea: #12303a; --sea-line: #1c4250; --land: #27382f; --land-edge: #4b6152;
    --ink: #e6eee8; --ink-soft: #a5bab3; --card: #15262d; --paper: #132229; --line: #2e4651;
    --tai: #f07d63; --tai-soft: #3d2620; --nori: #84cbb0; --nori-soft: #1b3530; --mikan: #f0b44f; --mikan-soft: #3a3020;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1a20; --sea: #12303a; --sea-line: #1c4250; --land: #27382f; --land-edge: #4b6152;
  --ink: #e6eee8; --ink-soft: #a5bab3; --card: #15262d; --paper: #132229; --line: #2e4651;
  --tai: #f07d63; --tai-soft: #3d2620; --nori: #84cbb0; --nori-soft: #1b3530; --mikan: #f0b44f; --mikan-soft: #3a3020;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 260px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible { outline: 3px solid var(--mikan); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; }

/* ---------- top bar ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 10px; border-bottom: 2px solid var(--ink);
}
.logo { font-family: var(--f-pixel); font-size: 22px; letter-spacing: .06em; line-height: 1; display: flex; align-items: baseline; gap: 8px; }
.logo small { font-family: var(--f-body); font-size: 11px; color: var(--ink-soft); letter-spacing: .1em; }
.status { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-variant-numeric: tabular-nums; flex: 1 1 auto; }
.stat { display: flex; align-items: baseline; gap: 6px; }
.stat .k { font-size: 11px; color: var(--ink-soft); letter-spacing: .08em; }
.stat .v { font-family: var(--f-pixel); font-size: 17px; }
.pips { display: inline-flex; gap: 3px; }
.pip { width: 11px; height: 15px; border: 2px solid var(--ink); background: transparent; }
.pip.on { background: var(--mikan); }
.menu { display: flex; flex-wrap: wrap; gap: 6px; }
.mbtn {
  font-family: var(--f-pixel); font-size: 14px; border: 2px solid var(--ink); background: var(--card); padding: 4px 10px; cursor: pointer;
  box-shadow: 2px 2px 0 var(--ink);
}
.mbtn:hover { background: var(--mikan-soft); }
.mbtn:active { transform: translate(2px,2px); box-shadow: none; }

/* ---------- stage ---------- */
.stage { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; padding-block: 16px; }
@media (max-width: 860px) { .stage { grid-template-columns: minmax(0,1fr); } }
.mapbox { border: 2px solid var(--ink); background: var(--sea); position: relative; min-width: 0; }
.mapbox svg { display: block; width: 100%; height: auto; }
.mapcap { margin: 0; padding: 6px 10px; font-size: 12px; color: var(--ink-soft); background: var(--card); border-top: 2px solid var(--ink); }
@media (max-width: 860px) {
  .top { position: static; }
  .logo { font-size: 19px; }
  .mbtn { font-size: 13px; padding: 3px 8px; }
  .stat .v { font-size: 15px; }
  .win { padding: 16px 14px 10px; min-height: 96px; }
  .txt { font-size: 15px; max-height: 26vh; }
  .face { width: 64px; height: 64px; }
  .win { gap: 10px; }
  body { padding-block: 0 220px; }
}
.node { cursor: pointer; }
.node circle.dot { fill: var(--card); stroke: var(--ink); stroke-width: 2.5; transition: r .2s; }
.node:hover circle.dot { fill: var(--mikan-soft); }
.node.here circle.dot { fill: var(--tai); }
.node text.nm { font-family: var(--f-pixel); font-size: 15px; fill: var(--ink); paint-order: stroke; stroke: var(--land); stroke-width: 4px; }
.node.isle text.nm { stroke: var(--sea); }
.node text.pg { font-size: 10px; fill: var(--ink-soft); paint-order: stroke; stroke: var(--land); stroke-width: 3px; }
.node.isle text.pg { stroke: var(--sea); }
.node .ring { fill: none; stroke: var(--tai); stroke-width: 2; opacity: 0; }
.node.here .ring { opacity: 1; animation: pulse 1.8s ease-out infinite; }
@keyframes pulse { from { r: 14; opacity: .9; } to { r: 30; opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .node.here .ring { animation: none; opacity: .7; } }

.panel { border: 2px solid var(--ink); background: var(--card); padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.loc-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.loc-h h2 { font-family: var(--f-pixel); font-weight: 400; font-size: 26px; margin: 0; line-height: 1.1; }
.loc-h .kana { font-size: 12px; color: var(--ink-soft); letter-spacing: .12em; }
.loc-h .found { margin-left: auto; font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.loc-desc { margin: 0; color: var(--ink-soft); font-size: 14px; }
.sec-label { font-size: 11px; letter-spacing: .14em; color: var(--ink-soft); margin: 0 0 6px; }
.people { display: flex; flex-direction: column; gap: 6px; }
.person {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; text-align: left;
  border: 2px solid var(--line); background: var(--paper); padding: 6px 10px 6px 6px; cursor: pointer;
}
.person:hover { border-color: var(--ink); }
.pinfo { display: flex; flex-direction: column; min-width: 0; line-height: 1.4; }
.person .pn { font-weight: 700; }
.person .pr { font-size: 12px; color: var(--ink-soft); }
.person .hearts { color: var(--tai); letter-spacing: 1px; font-size: 14px; white-space: nowrap; }
.mini { width: 44px; height: 44px; image-rendering: pixelated; border: 2px solid var(--ink); display: block; }
.scene { display: block; width: 100%; height: auto; aspect-ratio: 128 / 48; image-rendering: pixelated; border: 2px solid var(--ink); margin: -2px 0 0; }
.scene-wrap { position: relative; margin: -16px -16px 0; }
.scene-wrap .scene { border-width: 0 0 2px; }
.season { position: absolute; right: 8px; top: 6px; font-family: var(--f-pixel); font-size: 12px; background: rgba(20,30,36,.7); color: #f6f2e8; padding: 0 6px; }
.pface { width: 30px; height: 30px; image-rendering: pixelated; border: 2px solid var(--ink); }
.face { width: 108px; height: 108px; flex: none; image-rendering: pixelated; border: 3px solid var(--ink); }
.wbody { flex: 1 1 auto; min-width: 0; }
.avs { display: flex; flex-wrap: wrap; gap: 10px; }
.av { border: 2px solid var(--line); background: var(--paper); padding: 6px 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--ink-soft); }
.av img { width: 72px; height: 72px; image-rendering: pixelated; border: 2px solid var(--ink); }
.av[aria-pressed="true"] { border-color: var(--tai); box-shadow: 0 0 0 2px var(--tai); color: var(--ink); }
.rankbox { border: 2px solid var(--mikan); background: var(--mikan-soft); padding: 12px 14px; margin-top: 14px; }
.agree { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; }
.agree input { margin-top: 4px; }
tr.me td { background: var(--mikan-soft); font-weight: 700; }
table.nw th, table.nw td { white-space: nowrap; }
.rn { display: inline-flex; align-items: center; gap: 6px; }
.rn img { width: 22px; height: 22px; image-rendering: pixelated; border: 1px solid var(--ink); }
.slots { display: flex; flex-direction: column; gap: 8px; }
.slot { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; border: 2px solid var(--line); background: var(--paper); padding: 8px 10px; }
.slot .mini.empty { border-style: dashed; border-color: var(--line); }
.sinfo { display: flex; flex-direction: column; min-width: 0; font-size: 13px; line-height: 1.5; }
.sinfo span { color: var(--ink-soft); }
.sinfo .when { font-size: 11px; }
.sbtns { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
@media (max-width: 560px) { .slot { grid-template-columns: auto minmax(0, 1fr); } .sbtns { grid-column: 1 / -1; justify-content: flex-start; } }
.h4 { font-family: var(--f-pixel); font-weight: 400; font-size: 17px; margin: 18px 0 6px; }
textarea.code { width: 100%; min-height: 70px; font: 12px/1.4 ui-monospace, Consolas, monospace; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); padding: 6px 8px; margin-top: 6px; word-break: break-all; }
.mbtn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
.friends { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
.friend { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--ink-soft); width: 64px; text-align: center; }
.friend img { width: 56px; height: 56px; image-rendering: pixelated; border: 2px solid var(--ink); }
.person.new .pn::after { content: "未"; font-size: 10px; margin-left: 6px; padding: 0 4px; border: 1px solid var(--tai); color: var(--tai); vertical-align: 2px; }
.acts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.act {
  display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 2px solid var(--ink); background: var(--card);
  padding: 9px 12px; cursor: pointer; box-shadow: 3px 3px 0 var(--ink); text-align: left; font-weight: 500;
}
.act:hover:not(:disabled) { background: var(--nori-soft); }
.act:active:not(:disabled) { transform: translate(3px,3px); box-shadow: none; }
.act:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
.cost { font-family: var(--f-pixel); font-size: 12px; color: var(--mikan); white-space: nowrap; }
.moves { display: flex; flex-wrap: wrap; gap: 6px; }
.mv { border: 1.5px solid var(--line); background: var(--paper); padding: 4px 9px; font-size: 13px; cursor: pointer; }
.mv:hover:not(:disabled) { border-color: var(--ink); }
.mv:disabled { opacity: .4; cursor: not-allowed; }
.mv .cost { margin-left: 4px; }
.endturn {
  font-family: var(--f-pixel); font-size: 18px; padding: 12px; border: 2px solid var(--ink); background: var(--tai); color: #fff8f2;
  cursor: pointer; box-shadow: 3px 3px 0 var(--ink); letter-spacing: .08em;
}
:root[data-theme="dark"] .endturn { color: #1a0d09; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .endturn { color: #1a0d09; } }
.endturn:active { transform: translate(3px,3px); box-shadow: none; }

/* ---------- dialog ---------- */
#dlg {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); pointer-events: none;
}
.win {
  pointer-events: auto; max-width: 1180px; margin: 0 auto; position: relative; background: var(--paper); color: var(--ink);
  border: 3px solid var(--ink); outline: 2px solid var(--paper); box-shadow: 0 0 0 5px var(--ink), var(--shadow);
  padding: 18px 20px 14px; min-height: 120px; display: flex; gap: 16px; align-items: flex-start;
}
.who {
  position: absolute; top: -16px; left: 16px; font-family: var(--f-pixel); font-size: 14px; background: var(--ink); color: var(--paper);
  padding: 2px 12px; letter-spacing: .06em;
}
.who:empty { display: none; }
.txt { font-family: var(--f-pixel); font-size: 17px; line-height: 1.75; white-space: pre-line; min-height: 3.5em; max-height: 34vh; overflow-y: auto; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 8px; }
.ch {
  font-family: var(--f-pixel); font-size: 15px; border: 2px solid var(--ink); background: var(--card); padding: 6px 14px; cursor: pointer;
}
.ch:hover { background: var(--mikan-soft); }
.ch.next::after { content: " ▼"; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }
@media (prefers-reduced-motion: reduce) { .ch.next::after { animation: none; } }

/* ---------- toast ---------- */
#toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 70px); z-index: 30; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; pointer-events: none; }
.toast { font-family: var(--f-pixel); font-size: 14px; background: var(--ink); color: var(--paper); padding: 4px 10px; animation: rise 2.6s ease forwards; }
.toast.minus { background: var(--tai); color: #fff8f2; }
@keyframes rise { 0% { transform: translateY(8px); opacity: 0; } 12% { transform: none; opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-6px); } }

/* ---------- sheets ---------- */
.sheet { position: fixed; inset: 0; z-index: 40; background: rgba(13,26,32,.55); display: flex; justify-content: center; align-items: flex-start; overflow-y: auto;
  padding: calc(env(safe-area-inset-top, 0px) + 24px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(16px, env(safe-area-inset-left, 0px)); }
.sheet-in { background: var(--card); border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); width: 100%; max-width: 920px; padding: 20px; position: relative; min-width: 0; }
.sheet-in h3 { font-family: var(--f-pixel); font-weight: 400; font-size: 24px; margin: 0 0 4px; }
.sheet-in .lead { color: var(--ink-soft); margin: 0 0 16px; font-size: 14px; }
.close { position: absolute; top: 12px; right: 12px; font-family: var(--f-pixel); border: 2px solid var(--ink); background: var(--paper); padding: 2px 10px; cursor: pointer; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.tab { font-family: var(--f-pixel); border: 2px solid var(--ink); background: var(--paper); padding: 4px 12px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--paper); }

.metrics { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.metric { border: 2px solid var(--line); background: var(--paper); padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 0 8px; min-width: 0; }
.metric .mk { font-size: 12px; color: var(--ink-soft); grid-column: 1 / -1; }
.metric .mv2 { font-family: var(--f-pixel); font-size: 22px; font-variant-numeric: tabular-nums; }
.metric .md { font-size: 12px; align-self: end; font-variant-numeric: tabular-nums; }
.metric .md.up { color: var(--nori); }
.metric .md.down { color: var(--tai); }
.metric svg { grid-column: 1 / -1; width: 100%; height: 30px; margin-top: 4px; }
.metric .src { grid-column: 1 / -1; font-size: 11px; color: var(--ink-soft); }
.note { font-size: 12px; color: var(--ink-soft); margin-top: 12px; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.card { border: 2px solid var(--line); background: var(--paper); padding: 10px 12px; min-width: 0; }
.card .ct { font-weight: 700; display: flex; gap: 8px; align-items: baseline; }
.badge { font-size: 11px; padding: 0 6px; border: 1.5px solid currentColor; white-space: nowrap; font-weight: 500; }
.badge.charm { color: var(--nori); }
.badge.issue { color: var(--tai); }
.card p { margin: 4px 0 0; font-size: 13px; color: var(--ink-soft); }
.card.unk { opacity: .55; border-style: dashed; }
.dhead { font-family: var(--f-pixel); font-size: 18px; margin: 16px 0 8px; display: flex; gap: 8px; align-items: baseline; }
.dhead small { font-family: var(--f-body); font-size: 12px; color: var(--ink-soft); }

.plist { display: flex; flex-direction: column; gap: 10px; }
.proj { border: 2px solid var(--line); background: var(--paper); padding: 12px 14px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 6px 14px; }
.proj.on { border-color: var(--nori); background: var(--nori-soft); }
.proj.ready { border-color: var(--mikan); }
.proj .pt { font-weight: 700; font-size: 16px; }
.proj .pa { font-size: 12px; color: var(--ink-soft); margin-left: 6px; font-weight: 400; }
.proj .pd { grid-column: 1; font-size: 13px; color: var(--ink-soft); margin: 0; }
.proj .req { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 6px; font-size: 12px; }
.req span { padding: 1px 7px; border: 1.5px solid var(--line); background: var(--card); }
.req span.ok { border-color: var(--nori); color: var(--nori); }
.proj .eff { grid-column: 1 / -1; font-size: 12px; color: var(--nori); }
.proj .side { grid-column: 2; grid-row: 1 / span 2; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.go { font-family: var(--f-pixel); border: 2px solid var(--ink); background: var(--mikan); color: #1e1408; padding: 6px 12px; cursor: pointer; box-shadow: 2px 2px 0 var(--ink); white-space: nowrap; }
.go:disabled { background: var(--paper); color: var(--ink-soft); cursor: not-allowed; box-shadow: none; opacity: .7; }
.price { font-family: var(--f-pixel); font-size: 14px; white-space: nowrap; }
.tagon { font-family: var(--f-pixel); font-size: 13px; color: var(--nori); }

.ppl { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr)); gap: 10px; }
.pp { border: 2px solid var(--line); background: var(--paper); padding: 10px 12px; display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 4px 12px; align-items: start; }
.pp > img { width: 72px; height: 72px; image-rendering: pixelated; border: 2px solid var(--ink); grid-row: span 2; }
.pp .hearts { color: var(--tai); }
.pp p { margin: 2px 0 0; font-size: 13px; color: var(--ink-soft); }
.pp .pfull { grid-column: 1 / -1; }

/* ---------- title / ending ---------- */
.title-in { max-width: 760px; }
.bigtitle { font-family: var(--f-pixel); font-size: clamp(40px, 9vw, 72px); line-height: 1; margin: 8px 0 6px; letter-spacing: .04em; }
.bigtitle span { color: var(--tai); }
.sub { font-size: 15px; color: var(--ink-soft); margin: 0 0 18px; }
.field { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 14px 0; }
.field label { font-size: 13px; color: var(--ink-soft); }
.field input { font: inherit; font-family: var(--f-pixel); font-size: 18px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); padding: 6px 10px; width: min(260px, 100%); }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.goals { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin: 16px 0; }
.goal { border: 2px solid var(--line); padding: 10px 12px; background: var(--paper); }
.goal b { font-family: var(--f-pixel); font-weight: 400; font-size: 16px; display: block; }
.goal span { font-size: 13px; color: var(--ink-soft); }
.fine { font-size: 12px; color: var(--ink-soft); margin-top: 14px; }
.fine a { color: inherit; }
.rank { font-family: var(--f-pixel); font-size: 84px; line-height: 1; color: var(--tai); }
table.res { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
table.res th, table.res td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: right; }
table.res th:first-child, table.res td:first-child { text-align: left; }
.tbl { overflow-x: auto; }
.help h4 { font-family: var(--f-pixel); font-weight: 400; font-size: 17px; margin: 16px 0 4px; }
.help p, .help li { font-size: 14px; }
.help ul { padding-left: 1.2em; margin: 4px 0; }
</style>
</head>

  if (fi || ti) return (fi ? to : from) === "morozaki" ? 1 : 2;
  return 1;
}

/* =========================================================
   会話窓
   ========================================================= */
let typing = null;
let curFace = null; // 会話窓に出している顔の id
function setFace(id) {
  const img = $("#face");
  curFace = id && CHAR[id] ? id : null;
  if (!curFace) { img.hidden = true; return; }
  img.hidden = false;
  img.style.background = charBg(curFace);
  img.src = faceURL(curFace, baseMouth(curFace));
  img.alt = NPC[curFace] ? NPC[curFace].name : "あなた";
}
// 誰の顔を出すか：人物名なら本人、地の文（who なし）ならプレイヤー、見出しつきの知らせは顔なし
function faceFor(who, face) {
  if (face !== undefined) return face;
  if (!who) return S ? S.avatar || "pa" : null;
  return NAME2ID[who] || null;
}
setInterval(() => {
  if (!curFace || typing || document.hidden) return;
  const img = $("#face");
  img.src = faceURL(curFace, baseMouth(curFace), "blink");
  setTimeout(() => { if (curFace) img.src = faceURL(curFace, baseMouth(curFace)); }, 140);
}, 3400);

function show(who, text, options, resolve, face) {
  const whoEl = $("#who"), txt = $("#txt"), ch = $("#choices");
  whoEl.textContent = who || "";
  ch.innerHTML = "";
  setFace(faceFor(who, face));
  if (typing) { clearInterval(typing.timer); typing = null; }
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const full = text;
  const img = $("#face"), talker = curFace;
  const finish = () => {
    if (typing) { clearInterval(typing.timer); typing = null; }
    txt.textContent = full;
    if (talker && curFace === talker) img.src = faceURL(talker, baseMouth(talker));
  };
  if (reduce || !options) { txt.textContent = full; }
  else {
    let i = 0, tick = 0; txt.textContent = "";
    typing = { timer: setInterval(() => {
      i += 2; tick++;
      txt.textContent = full.slice(0, i);
      if (talker && who && tick % 3 === 0) img.src = faceURL(talker, (tick / 3) % 2 ? "open" : baseMouth(talker));
      if (i >= full.length) finish();
    }, 22) };
  }
  txt.onclick = finish;
  if (!options) return;
  options.forEach((o) => {
    const b = document.createElement("button");
    b.className = "ch" + (o.next ? " next" : "");
    b.textContent = o.label;
    b.onclick = () => {
      if (typing) { finish(); return; }
      Sound.se(o.next ? "next" : "sel");
      ch.innerHTML = ""; resolve(o.value);
    };
    ch.appendChild(b);
  });
  const first = ch.querySelector("button"); if (first) first.focus({ preventScroll: true });
}
function say(who, text, face) { return new Promise((res) => show(who, text, [{ label: "次へ", value: 0, next: true }], res, face)); }
function choose(who, text, labels, face) { return new Promise((res) => show(who, text, labels.map((l, i) => ({ label: l, value: i })), res, face)); }
function idle() {
  if (!S || S.over) return;
  const d = DIST[S.loc];
  const tip = S.ap === 0 ? "行動力が残っていない。右の「今月を終える」で次の月へ進もう。" : "歩いて探す・人と話す・発信する。見つけた魅力と信頼がそろったら「企画」を開こう。";
  show(null, `${dateLabel(S.turn)}　${d.name}にいる。行動力は残り ${S.ap}。\n${tip}`, null);
}
async function run(fn) {
  if (busy || !S || S.over) return;
  busy = true; render();
  const before = { ...S.m, budget: S.budget };
  try { await fn(); } finally {
    busy = false; diffToasts(before); save(); render(); if (!S.over) idle();
  }
}

/* =========================================================
   トースト
   ========================================================= */
function toast(t, minus) {
  const el = document.createElement("div");
  el.className = "toast" + (minus ? " minus" : ""); el.textContent = t;
  $("#toasts").appendChild(el); setTimeout(() => el.remove(), 2700);
}
function diffToasts(b) {
  const m = S.m;
  const items = [
    ["関係人口", m.kankei - b.kankei, 1, "人"], ["予算", S.budget - b.budget, 1, "万円"],
    ["漁業", m.fish - b.fish, 0.3, ""], ["農業", m.agri - b.agri, 0.3, ""], ["観光・商業", m.shop - b.shop, 0.3, ""],
    ["満足度", m.sat - b.sat, 0.3, ""], ["新しい産業", m.newInd - b.newInd, 1, ""],
  ];
  items.forEach(([k, d, th, u]) => {
    if (Math.abs(d) >= th) toast(`${k} ${d > 0 ? "+" : ""}${Math.abs(d) >= 10 || th === 1 ? fmt(d) : d.toFixed(1)}${u}`, d < 0);
  });
}

/* =========================================================
   成長
   ========================================================= */
async function gainExp(n) {
  S.exp += n;
  while (S.lv < LV_EXP.length && S.exp >= LV_EXP[S.lv]) {
    S.lv++;
    Sound.se("levelup");
    const opts = [
      ["企画力", "plan", "プロジェクトの費用が10%下がる"], ["発信力", "post", "発信と関係人口の伸びが大きくなる"],
      ["交渉力", "nego", "話すと信頼が多めに上がることがある"], ["体力", "stamina", "毎月の行動力が1増える"],
    ].filter((o) => S.skills[o[1]] < 3);
    if (!opts.length) continue;
    const i = await choose("レベルアップ", `レベル${S.lv}になった！\n伸ばしたい力をひとつ選ぼう。`, opts.map((o) => `${o[0]}（${o[2]}）`));
    const k = opts[i][1]; S.skills[k]++;
    if (k === "stamina") { S.apMax++; S.ap++; }
  }
}
function addTrust(id, n) { if (n > 0 && trust(id) < 5) Sound.se("trust"); S.trust[id] = clamp(trust(id) + n, 0, 5); }
function discover(id, quiet) {
  if (S.found[id] !== undefined) return false;
  S.found[id] = S.turn;
  Sound.se("discover");
  if (!quiet) { const c = CARDS[id]; toast(`${c.t === "charm" ? "魅力" : "課題"}を発見：${c.name}`); }
  return true;
}
function spend(n) { if (S.ap < n) return false; S.ap -= n; return true; }
function applyEff(e, mult = 1) {
  const m = S.m;
  if (e.kankei) m.kankei += e.kankei * mult * (1 + 0.15 * S.skills.post);
  if (e.pop) m.pop += e.pop * mult;
  if (e.fish) m.fish += e.fish * mult;
  if (e.agri) m.agri += e.agri * mult;
  if (e.shop) m.shop += e.shop * mult;
  if (e.sat) m.sat += e.sat * mult;
  if (e.idx) m.idx += e.idx / 100;
  if (e.stay) m.stay += e.stay / 100;
  normalize();
}
function normalize() {
  const m = S.m;
  m.fish = clamp(m.fish, 40, 160); m.agri = clamp(m.agri, 40, 160); m.shop = clamp(m.shop, 40, 160);
  m.sat = clamp(m.sat, 0, 100); m.stay = clamp(m.stay, 0.05, 0.7); m.idx = clamp(m.idx, 0.4, 2); m.kankei = Math.max(0, m.kankei);
}

/* =========================================================
   行動
   ========================================================= */
function explore() {
  run(async () => {
    if (!spend(1)) return;
    const d = DIST[S.loc];
    const next = d.cards.find((id) => S.found[id] === undefined);
    if (next) {
      discover(next, true);
      const c = CARDS[next];
      await say("発見", `${d.name}を歩いて、${c.t === "charm" ? "隠れた魅力" : "町の課題"}を見つけた！\n「${c.name}」`);
      await say(null, c.text);
      await gainExp(6);
    } else {
      S.m.kankei += 5;
      await say(null, pick(d.idle) + "\n（この地区で新しく見つかるものは、もうなさそうだ）");
      await gainExp(2);
    }
  });
}

function post() {
  run(async () => {
    const d = DIST[S.loc];
    const n = d.cards.filter((id) => S.found[id] !== undefined && CARDS[id].t === "charm").length;
    if (!n || S.posted[S.loc] || !spend(1)) return;
    S.posted[S.loc] = true; S.posts++;
    const gain = Math.round(20 * n * (1 + 0.3 * S.skills.post) * (S.flags.digital ? 1.2 : 1));
    S.m.kankei += gain;
    const charm = CARDS[pick(d.cards.filter((id) => S.found[id] !== undefined && CARDS[id].t === "charm"))];
    await say("発信", `「${charm.name}」の写真と物語をSNSに投稿した。\n町の外から ${fmt(gain)} 人ほどが反応してくれた。`);
    await gainExp(5);
  });
}

function npcMenu(id) {
  run(async () => {
    const p = NPC[id];
    const opts = [];
    const canTalk = !S.talked[id];
    opts.push(canTalk ? "話す（行動力1）" : "話す（今月はもう話した）");
    opts.push(S.met[id] ? (S.helped[id] ? "手伝う（今月はもう手伝った）" : "手伝う（行動力2）") : "手伝う（まず話してみよう）");
    opts.push("やめる");
    const i = await choose(p.name, `${p.role}。信頼 ${hearts(trust(id))}`, opts);
    if (i === 0) await talk(id);
    if (i === 1) await help(id);
  });
}

async function talk(id) {
  const p = NPC[id];
  if (S.talked[id]) { await say(p.name, `「${PROFILE[id].again}」\n（今月はもう話した。次は来月か、手伝ってみよう）`); return; }
  if (!spend(1)) { await say(null, "行動力が足りない。"); return; }
  const first = !S.met[id];
  S.talked[id] = true; S.met[id] = true;
  const t = trust(id);
  await say(p.name, `「${p.lines[t]}」`);
  if (first) {
    const pf = PROFILE[id];
    await say(`${p.name}（${pf.age}歳）`, `${pf.profile}\n好きなもの：${pf.like}`, id);
  }
  if (p.reveal && p.reveal[t] && discover(p.reveal[t], true)) {
    const c = CARDS[p.reveal[t]];
    await say("発見", `話の中から、${c.t === "charm" ? "隠れた魅力" : "町の課題"}がわかった。\n「${c.name}」\n${c.text}`);
  }
  let gain = 1;
  if (S.skills.nego && Math.random() < 0.25 * S.skills.nego) gain = 2;
  addTrust(id, gain);
  if (gain === 2) toast(`${p.name}の信頼 +2`); else toast(`${p.name}の信頼 +1`);
  await gainExp(4);
  // 隠れたイベント
  if (id === "hamada" && trust(id) >= 3 && !S.flags.satoIn && S.turn >= 3) await satoArrives();
}

async function help(id) {
  const p = NPC[id];
  if (!S.met[id] || S.helped[id]) return;
  if (!spend(2)) { await say(null, "行動力が足りない（手伝うには2必要）。"); return; }
  S.helped[id] = true;
  addTrust(id, 1);
  applyEff(p.helpEff);
  await say(null, `${p.help}\n${p.name}の信頼が上がった。`);

}

function moveTo(to) {

function startProject(id) {
  run(async () => {
    const p = PROJ[id];
    if (!canStart(id).ok) return;
    closeSheet();
    S.budget -= projCost(p); S.ap -= 2;
    S.projects[id] = { start: S.turn };
    if (p.flag) S.flags[p.flag] = true;
    if (p.once) applyEff(p.once);
    if (p.newInd) S.m.newInd++;
    Sound.se("project");
    await say("プロジェクト開始", `「${p.name}」が動き出した！\n${p.desc}`);
    for (const [who, line] of p.launch) await say(NPC[who].name, `「${line}」`);

function reqStatus(id) {
  const p = PROJ[id], r = p.req, out = [];
  (r.cards || []).forEach((c) => out.push({ ok: S.found[c] !== undefined, label: S.found[c] !== undefined ? CARDS[c].name : `？？？（${DIST[CARDS[c].d].name}で見つかるかも）`, type: CARDS[c].t }));
  Object.entries(r.trust || {}).forEach(([n, v]) => {
    const okNpc = npcAvail(n);
    out.push({ ok: trust(n) >= v, label: `${S.met[n] ? NPC[n].name : (okNpc ? DIST[NPC[n].d].name + "の誰か" : "まだ出会っていない人")} ♥${v}以上` });
  });
  if (r.minProjects) out.push({ ok: activeCount() >= r.minProjects, label: `動いているプロジェクト ${r.minProjects}つ以上（今${activeCount()}）` });
  return out;
}
function canStart(id) {
  const p = PROJ[id];
  if (S.projects[id]) return { ok: false, why: "実施中" };
  if (p.needFlag && !S.flags[p.needFlag]) return { ok: false, why: "条件未達" };
  const rs = reqStatus(id);
  if (!rs.every((r) => r.ok)) return { ok: false, why: "条件未達" };
  if (S.budget < projCost(p)) return { ok: false, why: "予算不足" };
  if (S.ap < 2) return { ok: false, why: "行動力不足" };
  return { ok: true };
}
function projVisible(id) {
  const p = PROJ[id];
  if (S.projects[id]) return true;
  if (p.needFlag && !S.flags[p.needFlag]) return false;
  const r = p.req;
  if ((r.cards || []).some((c) => S.found[c] !== undefined)) return true;
  if (Object.keys(r.trust || {}).some((n) => trust(n) >= 2)) return true;
  return false;
}

/* =========================================================
   月の終わり
   ========================================================= */
function snapshot() { const m = S.m; return { t: S.turn, pop: m.pop, kankei: m.kankei, tour: annualTourists(m), stay: m.stay, spend: annualSpend(m), fish: m.fish, agri: m.agri, shop: m.shop, sat: m.sat, newInd: m.newInd, budget: S.budget }; }

function endMonth() {
  run(async () => {
    if (S.ap > 0) {
      const i = await choose(null, `行動力がまだ ${S.ap} 残っている。今月を終えますか？`, ["今月を終える", "もう少し動く"]);
      if (i !== 0) return;
    }
    const m = S.m, mi = monthIdx(S.turn);
    const b = { ...m };
    // 何もしなくても進むこと
    m.pop *= 1 - 0.0017;
    m.kankei *= 0.99;
    m.idx *= 1 - 0.0033;
    m.fish -= 0.15; m.agri -= 0.15; m.shop -= 0.15; m.sat -= 0.1;
    // プロジェクトの効果
    let furusato = 0;
    Object.keys(S.projects).forEach((id) => {
      const p = PROJ[id];
      applyEff(p.monthly || {}, S.flags.digital && id !== "p_digital" ? 1.1 : 1);
      furusato += (p.monthly && p.monthly.furusato) || 0;
      if (p.summer && (mi === 3 || mi === 4)) m.shop += p.summer;
      if (p.winter && (mi === 8 || mi === 9 || mi === 10)) m.shop += p.winter;
    });
    // 関係人口のうち、ごく一部が移り住む
    m.pop += m.kankei * 0.0003;
    S.budget += furusato;
    normalize();
    const monthTour = (TOURIST_BASE * m.idx / 12) * SEASON[mi];
    S.hist.push(snapshot());

    let rep = `${dateLabel(S.turn)}が終わった。\n` +
      `今月の観光客（推計）約${(monthTour / 10000).toFixed(1)}万人　関係人口 ${fmt(m.kankei)}人（${m.kankei - b.kankei >= 0 ? "+" : ""}${fmt(m.kankei - b.kankei)}）\n` +
      `町の人口 ${fmt(m.pop)}人` + (furusato ? `　ふるさと納税などの寄附 +${furusato}万円` : "");
    Sound.se("month");
    await say("月のまとめ", rep);

    if (mi === 11) await yearReport();
    S.turn++;
    if (S.turn >= TOTAL_TURNS) { await finale(); return; }
    // 新しい月
    S.talked = {}; S.helped = {}; S.posted = {}; S.ap = S.apMax;
    if (monthIdx(S.turn) === 0) {
      S.budget += BUDGET_YEAR;
      await say("浜田みのり", `「新年度になりました。任期${termYear(S.turn)}年目ですね。今年度の活動予算として${BUDGET_YEAR}万円を確保しました」`);
    }
    await runEvents();
  });
}

async function yearReport() {
  const y = termYear(S.turn);
  const startSnap = y === 1 ? { kankei: START.kankei, pop: START.pop, tour: TOURIST_BASE * START.idx } : S.hist[(y - 1) * 12 - 1];
  const now = snapshot();
  await say("年度末報告会", `任期${y}年目の報告会が、役場で開かれた。\n` +
    `関係人口 ${fmt(startSnap.kankei)}人 → ${fmt(now.kankei)}人\n` +
    `年間観光客（推計） ${(startSnap.tour / 10000).toFixed(0)}万人 → ${(now.tour / 10000).toFixed(0)}万人\n` +
    `町の人口 ${fmt(startSnap.pop)}人 → ${fmt(now.pop)}人\n動いているプロジェクト ${activeCount()}件　新しい産業 ${now.newInd}件`);
  const c = activeCount();
  const line = c === 0 ? "まずは町を歩いて、人と知り合うところからですね。焦らなくて大丈夫です。"
    : c < 3 ? "動き出したプロジェクトの話、町のあちこちで聞くようになりましたよ。"
    : "議会でも、あなたの取り組みが話題になっています。町の人の顔つきが変わってきました。";
  await say("浜田みのり", `「${line}」`);
}

   イベント

async function satoArrives() {
  S.flags.satoIn = true;
  await say("浜田みのり", "「そうだ、名古屋のIT企業から、社員研修の場所を探しているという相談が来ています。師崎港観光センターで会ってもらえませんか」");
  await say(null, "（師崎に「佐藤」さんが現れるようになった）");
}

async function runEvents() {
  const mi = monthIdx(S.turn), y = termYear(S.turn);
  // 決まった時期のイベント
  if (mi === 1) await evGW();
  if (mi === 3) await evTaimatsuri();
  if (mi === 4) await evHeat();
  if (mi === 5 && Math.random() < 0.6) await evTyphoon();
  if (mi === 6) await evOnbe();
  if (mi === 8) await evFugu();
  if (mi === 9) await say(null, "1月。師崎では左義長祭が開かれ、正月飾りを燃やす火が港を照らした。町の人たちと一年の無事を祈った。");
  if (S.turn === 7 && !S.flags.satoIn) await satoArrives();
  // ときどき起きること
  if (S.turn >= 26 && !S.used.quake && Math.random() < 0.3) { await evQuake(); return; }
  if (S.turn === 33 && !S.used.quake) { await evQuake(); return; }
  if (Math.random() < 0.45) {
    const pool = [
      { id: "shirasu", w: 2, ok: () => (S.used.shirasu || 0) < 3, f: evShirasu },
      { id: "aji", w: 2, ok: () => !S.flags.ajiBoom && S.turn >= 4, f: evAji },
      { id: "tako", w: 1, ok: () => (S.used.tako || 0) < 2, f: evTako },
      { id: "buzz", w: 2, ok: () => S.posts >= 3 && !S.used.buzz, f: evBuzz },
      { id: "ryokan", w: 1, ok: () => (S.used.ryokan || 0) < 2, f: evRyokan },
      { id: "inbound", w: 1, ok: () => S.turn >= 6, f: evInbound },
      { id: "rina", w: 1, ok: () => !S.used.rina, f: evRina },
    ].filter((e) => e.ok());
    const total = pool.reduce((a, e) => a + e.w, 0);
    let r = Math.random() * total;
    for (const e of pool) { r -= e.w; if (r <= 0) { await e.f(); break; } }
  }
}

async function evGW() {
  await say("イベント", "ゴールデンウィーク。国道247号は、師崎港へ向かう車で数キロにわたって渋滞している。");
  if (S.flags.asakatsu) {
    S.m.sat += 1; S.m.idx += 0.004;
    await say(null, "朝活ツアーの参加者は、渋滞が始まる前に朝市へ着いていた。「朝のうちに来れば、こんなに快適なのか」と好評だ。");
    return;
  }

   ========================================================= */
function baseline() {
  const n = TOTAL_TURNS;
  const m = { pop: START.pop * Math.pow(1 - 0.0017, n), kankei: START.kankei * Math.pow(0.99, n), idx: START.idx * Math.pow(1 - 0.0033, n), stay: START.stay,
    fish: START.fish - 0.15 * n, agri: START.agri - 0.15 * n, shop: START.shop - 0.15 * n, sat: START.sat - 0.1 * n, newInd: 0 };
  m.pop += 0; // 何もしない場合は関係人口からの移住も小さい
  return m;
}
function score() {
  const m = S.m, b = baseline();
  const ind = (m.fish + m.agri + m.shop) / 3, indB = (b.fish + b.agri + b.shop) / 3;
  const parts = [
    ["関係人口", clamp((m.kankei - b.kankei) / 350, 0, 30), 30],
    ["観光消費", clamp((annualSpend(m) / annualSpend(b) - 1) * 30, 0, 20), 20],
    ["既存産業", clamp((ind - indB) / 1.5, 0, 20), 20],
    ["新しい産業", clamp(m.newInd * 5, 0, 15), 15],
    ["人口", clamp((m.pop - b.pop) / 15, 0, 10), 10],
    ["町民の満足度", clamp((m.sat - b.sat) / 2, 0, 5), 5],
  ];
  const total = Math.round(parts.reduce((a, p) => a + p[1], 0));
  return { parts, total, b };
}

let sheetKind = null;
function openSheet(kind) {
  if (!S && !["help", "title", "save", "rank"].includes(kind)) return;
  if (busy && kind !== "help" && kind !== "ending") return;
  sheetKind = kind;
  const box = $("#sheetIn");
  box.innerHTML = (kind === "title" || kind === "ending" ? "" : `<button class="close" id="closeSheet">閉じる</button>`) + sheetHTML(kind);
  $("#sheet").hidden = false;
  const c = $("#closeSheet"); if (c) { c.onclick = closeSheet; c.focus({ preventScroll: true }); }
  bindSheet(kind);
  box.scrollTop = 0; $("#sheet").scrollTop = 0;
}
function closeSheet() { $("#sheet").hidden = true; sheetKind = null; if (!S) openSheet("title"); }

function spark(key) {
  const vals = [START_SNAP()[key], ...S.hist.map((h) => h[key])];
  if (vals.length < 2) return "";
  const min = Math.min(...vals), max = Math.max(...vals), span = max - min || 1;
  const pts = vals.map((v, i) => `${(i / (vals.length - 1)) * 200},${26 - ((v - min) / span) * 22}`).join(" ");
  const last = pts.split(" ").pop().split(",");
  return `<svg viewBox="0 0 204 30" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--nori)" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${last[0]}" cy="${last[1]}" r="3" fill="var(--tai)"/></svg>`;
}
function START_SNAP() { const m = START; return { pop: m.pop, kankei: m.kankei, tour: annualTourists(m), stay: m.stay, spend: annualSpend(m), fish: m.fish, agri: m.agri, shop: m.shop, sat: m.sat, newInd: 0, budget: BUDGET_YEAR }; }

function sheetHTML(kind) {
  if (kind === "title") return titleHTML();
  if (kind === "help") return helpHTML();
  if (kind === "save") return saveHTML();
  if (kind === "rank") return rankHTML();
  if (kind === "ending") return endingHTML();
  if (kind === "data") {
    const m = S.m, st = START_SNAP(), now = snapshot();
    const row = (k, label, val, startV, unit, src, dec = 0) => {
      let diff = now[k] - startV;
      if (k === "spend") { diff /= 1e8; dec = 1; unit = "億円"; }
      if (k === "tour") { diff /= 1e4; dec = 1; unit = "万人"; }
      const dtxt = Math.abs(diff) < (dec ? 0.05 : 0.5) ? "±0" : `${diff > 0 ? "+" : ""}${dec ? diff.toFixed(dec) : fmt(diff)}`;
      return `<div class="metric"><span class="mk">${label}</span><span class="mv2">${val}</span><span class="md ${diff > 0 ? "up" : diff < 0 ? "down" : ""}">開始時から ${dtxt}${unit}</span>${spark(k)}${src ? `<span class="src">${src}</span>` : ""}</div>`;

        }).join("") + `</div>`;
    });

  }
  if (kind === "people") {

    <div class="slot">

      : `<p class="note">まだ記録はありません。3年間の任期を終えると、ここに点数が残ります（このブラウザの中だけの記録です）。</p>`}`;

function loadState(st) {
  S = st; if (!S.avatar) S.avatar = "pa"; S.started = true;
  save(); closeSheet(); render();

function confirmClick(btn, label, fn) {
  if (btn.dataset.armed) { fn(); return; }
  btn.dataset.armed = "1"; const old = btn.textContent; btn.textContent = label;
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = old; } }, 3000);
}
function bindSave(box) {
  box.querySelectorAll("[data-slot-save]").forEach((b) => b.addEventListener("click", () => {
    const i = +b.dataset.slotSave, has = readKey(SLOT_KEYS[i]);
    const go = () => {
      const ok = writeKey(SLOT_KEYS[i], { at: new Date().toISOString(), state: S });
      Sound.se(ok ? "trust" : "bad"); toast(ok ? `スロット${i + 1}に保存しました` : "保存できませんでした（ブラウザの保存領域が使えません）", !ok);
      openSheet("save");
    };
    if (has) confirmClick(b, "上書きする？", go); else go();
  }));
  box.querySelectorAll("[data-slot-load]").forEach((b) => b.addEventListener("click", () => {
    const k = b.dataset.slotLoad;
    const st = k === "auto" ? load() : (readKey(SLOT_KEYS[+k]) || {}).state;
    if (!validState(st)) { toast("このデータは読み込めませんでした", true); return; }
    const go = () => loadState(JSON.parse(JSON.stringify(st)));
    if (S && S.started && !S.over && k !== "auto") confirmClick(b, "今の進み具合を置き換える？", go); else go();
  }));
  const ex = $("#btnExport", box), out = $("#codeOut", box), cp = $("#btnCopy", box), msg = $("#codeMsg", box);
  if (ex) ex.onclick = () => { out.value = encodeSave(S); out.hidden = false; cp.hidden = false; out.focus(); out.select(); msg.textContent = "セーブコードを作りました。コピーして保管してください。"; };
  if (cp) cp.onclick = () => {
    const fallback = () => { out.focus(); out.select(); msg.textContent = "コピーできませんでした。選択された文字列を手動でコピーしてください。"; };
    try { navigator.clipboard.writeText(out.value).then(() => { msg.textContent = "コピーしました。"; Sound.se("sel"); }, fallback); } catch (e) { fallback(); }
  };
  const im = $("#btnImport", box);
  if (im) im.onclick = () => {
    const st = decodeSave($("#codeIn", box).value);
    if (!st) { msg.textContent = "セーブコードを読み取れませんでした。「TSUNAGU1:」から最後まで、欠けずに貼り付けられているか確かめてください。"; Sound.se("bad"); return; }
    if (S && S.started && !S.over) confirmClick(im, "今の進み具合を置き換える？", () => loadState(st)); else loadState(st);
  };
}

    <p>${esc(epi)}</p>
    ${(() => { const fr = Object.keys(NPC).filter((id) => S.met[id] && trust(id) >= 3);
      return fr.length ? `<p class="sec-label">3年間で信頼を結んだ仲間たち</p><div class="friends">${fr.map((id) => `<div class="friend"><img src="${faceURL(id, "smile")}" style="background:${charBg(id)}" alt="">${esc(NPC[id].name)}</div>`).join("")}</div>` : ""; })()}
    <div class="tbl"><table class="res"><thead><tr><th>指標</th><th>開始時</th><th>何もしなかった場合</th><th>あなたの3年</th></tr></thead><tbody>
      ${r("町の人口", m.pop, b.pop, START.pop, (v) => fmt(v) + "人")}
      ${r("関係人口", m.kankei, b.kankei, START.kankei, (v) => fmt(v) + "人")}
      ${r("年間観光客（推計）", annualTourists(m), annualTourists(b), annualTourists(START), (v) => (v / 10000).toFixed(1) + "万人")}
      ${r("宿泊する人の割合", m.stay, b.stay, START.stay, pct)}
      ${r("年間観光消費額（推計）", annualSpend(m), annualSpend(b), annualSpend(START), (v) => (v / 1e8).toFixed(1) + "億円")}
      ${r("漁業の元気", m.fish, b.fish, START.fish, (v) => v.toFixed(1))}
      ${r("農業の元気", m.agri, b.agri, START.agri, (v) => v.toFixed(1))}
      ${r("観光・商業の元気", m.shop, b.shop, START.shop, (v) => v.toFixed(1))}
      ${r("町民の満足度", m.sat, b.sat, START.sat, (v) => v.toFixed(1))}
      ${r("新しい産業", m.newInd, 0, 0, (v) => v + "件")}
    </tbody></table></div>
    <div class="tbl" style="margin-top:12px"><table class="res"><thead><tr><th>評価の内訳</th><th>得点</th><th>満点</th></tr></thead><tbody>
      ${parts.map((p) => `<tr><td>${p[0]}</td><td>${Math.round(p[1])}</td><td>${p[2]}</td></tr>`).join("")}</tbody></table></div>
    <p class="note">実施したプロジェクト：${names.length ? names.map(esc).join("、") : "なし"}</p>
    ${RANKING_URL ? `<div class="rankbox">
      <p class="h4" style="margin-top:0">みんなのランキングに参加する</p>
      ${S.submitted ? `<p class="note" style="margin-top:0">この結果はランキングに送信済みです。</p>` : `
      <div class="field" style="margin:6px 0"><label for="rankNick">ニックネーム（12文字まで）</label><input id="rankNick" maxlength="12" value="${esc(S.name)}"></div>
      <label class="agree"><input type="checkbox" id="rankAgree"> ニックネームと点数がランキングで公開されることに同意します（本名やメールアドレスは入れないでください）</label>
      <div class="row" style="margin-top:8px"><button class="go" id="btnSubmitRank" disabled>ランキングに送る</button></div>`}
      <p class="note" id="rankMsg" role="status"></p>
    </div>` : ""}
    <div class="row" style="margin-top:14px"><button class="go" id="btnAgain">もう一度あそぶ</button><button class="mbtn" id="btnLoadSave">これまでの記録を見る</button>${RANKING_URL ? `<button class="mbtn" id="btnShowRank">みんなのランキング</button>` : ""}</div>
    <p class="fine">数字はゲーム用の推計です。地名・施設・統計は公開情報にもとづき、人物と企業は架空です。</p>`;
}

function bindSheet(kind) {
  const box = $("#sheetIn");
  box.querySelectorAll("[data-start]").forEach((b) => b.addEventListener("click", () => startProject(b.dataset.start)));
  const nb = $("#btnNew", box); if (nb) nb.onclick = () => { const name = ($("#playerName").value || "みなみ").trim().slice(0, 10) || "みなみ"; startNew(name, titleAv); };
  box.querySelectorAll("[data-av]").forEach((b) => b.addEventListener("click", () => {
    titleAv = b.dataset.av; Sound.se("sel");
    box.querySelectorAll("[data-av]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  }));
  const cb = $("#btnCont", box); if (cb) cb.onclick = () => { S = load(); closeSheet(); render(); idle(); };
  const hb = $("#btnHelp", box); if (hb) hb.onclick = () => openSheet("help");
  const tb = $("#btnTitle", box); if (tb) tb.onclick = () => openSheet("title");
  const ab = $("#btnAgain", box); if (ab) ab.onclick = () => { clearSave(); S = null; Sound.bgm("field"); openSheet("title"); };
  box.querySelectorAll("[data-sound]").forEach((b) => b.addEventListener("click", toggleSound));
  const lb = $("#btnLoadSave", box); if (lb) lb.onclick = () => openSheet("save");
  if (kind === "save") bindSave(box);
  const sr = $("#btnShowRank", box); if (sr) sr.onclick = () => openSheet("rank");
  if (kind === "rank") loadRanking(box);
  const ag = $("#rankAgree", box), sb = $("#btnSubmitRank", box);
  if (ag && sb) {
    ag.onchange = () => { sb.disabled = !ag.checked; };
    sb.onclick = async () => {
      const nick = ($("#rankNick", box).value || "").trim();
      const msg = $("#rankMsg", box);
      if (!nick) { msg.textContent = RANK_ERR.nick; return; }
      sb.disabled = true; msg.textContent = "送信しています…";
      try {
        const j = await postResult(nick);
        if (j.ok) { Sound.se("project"); msg.textContent = `送信しました！ 今のところ ${j.position}位（全${j.count}件）です。`; sb.textContent = "送信済み"; }
        else { Sound.se("bad"); msg.textContent = RANK_ERR[j.error] || "送信できませんでした。"; sb.disabled = false; }
      } catch (e) { Sound.se("bad"); msg.textContent = "通信できませんでした。インターネットにつながっているか確かめてください。"; sb.disabled = false; }
    };
  }
}

function rankHTML() {
  return `<h3>みんなのランキング</h3>
    <p class="lead">任期を終えた人たちの点数の上位50件です。同じ点数なら、関係人口が多い順です。</p>
    <div id="rankBody"><p class="note">読み込んでいます…</p></div>
    <p class="fine">ランキングにはニックネームと結果だけが表示されます。不適切な名前を見つけた場合は、運営者が非表示にすることがあります。</p>`;
}
async function loadRanking(box) {
  const el = $("#rankBody", box);
  try {
    const j = await fetchRanking();
    if (!el.isConnected) return;
    const mine = new Set(myRuns());
    el.innerHTML = j.rows.length ? `<div class="tbl"><table class="res nw"><thead><tr><th>順位</th><th>ニックネーム</th><th>評価</th><th>点数</th><th>関係人口</th><th>新しい産業</th><th>日付</th></tr></thead><tbody>
      ${j.rows.map((r, i) => `<tr${mine.has(r.runId) ? ' class="me"' : ""}><td>${i + 1}</td><td><span class="rn"><img src="${faceURL(CHAR[r.avatar] ? r.avatar : "pa", "smile")}" style="background:${charBg(CHAR[r.avatar] ? r.avatar : "pa")}" alt="">${esc(r.nick)}${mine.has(r.runId) ? "（あなた）" : ""}</span></td><td>${esc(r.rank)}</td><td>${Number(r.total) || 0}</td><td>${fmt(Number(r.kankei) || 0)}人</td><td>${Number(r.newInd) || 0}件</td><td>${realDate(r.at).split(" ")[0]}</td></tr>`).join("")}
      </tbody></table></div><p class="note">参加者 ${j.count}件</p>` : `<p class="note">まだ誰も参加していません。最初の挑戦者になろう！</p>`;
  } catch (e) {
    if (el.isConnected) el.innerHTML = `<p class="note">ランキングを読み込めませんでした。時間をおいて開き直してください。</p>`;
  }
}

function toggleSound() {
  const on = Sound.toggle();
  document.querySelectorAll("[data-sound]").forEach((b) => { b.textContent = `音 ${on ? "ON" : "OFF"}`; b.setAttribute("aria-pressed", String(on)); });
  if (on) Sound.se("sel");
}

/* =========================================================
   開始
   ========================================================= */
let titleAv = "pa";
async function startNew(name, avatar) {
  clearSave();
  S = newState(name); S.started = true; S.avatar = avatar || "pa";
  closeSheet(); render();
  busy = true; render();
  try {
    await say(null, "2026年4月。名鉄知多新線の終点、内海駅。\n改札を出ると、潮のにおいがした。");
    await say("浜田みのり", `「${name}さんですね！ 南知多町役場、産業振興課の浜田です。今日から3年間、地域おこし協力隊としてよろしくお願いします」`);
    await say("浜田みのり", "「この町の人口は、町ができた1961年の約3万人から、今はおよそ半分。観光客も2016年の342万人から、2024年は179万人まで減りました」");
    await say("浜田みのり", "「でも、海も島も、魚も畑も、人も、まだまだ面白いんです。お願いしたいことは3つ」");
    await say("浜田みのり", "「町の隠れた魅力と課題を見つけること。この町に何度も関わってくれる『関係人口』を増やすこと。そして漁業・農業・観光を元気にして、新しい仕事を生み出すこと」");
    await say("浜田みのり", "「毎月使える行動力には限りがあります。歩いて探して、人と話して、手伝って。見つけた魅力と地元の人の信頼がそろったら、プロジェクトを始めましょう」");
    await say("浜田みのり", "「まずは、この内海の町を歩いてみてください。困ったら豊浜の役場にいますね」");
    S.met.hamada = true; S.trust.hamada = 1;
  } finally { busy = false; save(); render(); idle(); }
}

document.querySelectorAll("[data-sheet]").forEach((b) => b.addEventListener("click", () => openSheet(b.dataset.sheet)));
$("#btnSound").addEventListener("click", toggleSound);
$("#menuRank").hidden = !RANKING_URL;
$("#btnSound").textContent = `音 ${Sound.isOn() ? "ON" : "OFF"}`;
$("#btnSound").setAttribute("aria-pressed", String(Sound.isOn()));
$("#sheet").addEventListener("click", (e) => { if (e.target.id === "sheet" && sheetKind !== "title" && sheetKind !== "ending") closeSheet(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && sheetKind && sheetKind !== "title" && sheetKind !== "ending") { closeSheet(); return; }
  if ((e.key === "Enter" || e.key === " ") && !sheetKind && document.activeElement && document.activeElement.tagName !== "INPUT") {
    const btns = document.querySelectorAll("#choices .ch");
    if (btns.length === 1 && document.activeElement !== btns[0]) { e.preventDefault(); btns[0].click(); }
  }
});

function boot(data) {
  buildMap();
  if (data && data.state) { S = data.state; render(); if (S.over) openSheet("ending"); else idle(); return; }
  S = null;
  // タイトルの背景として仮の状態を描く
  S = newState("みなみ"); render(); S = null;
  show(null, "南知多町へようこそ。", null);
  openSheet("title");
}
try { window.claude?.hot?.snapshot?.(() => ({ state: S })); } catch (e) {}
if (window.claude?.hot?.ready) window.claude.hot.ready(boot); else boot(window.claude?.hot?.data ?? {});
</script>
</body>
